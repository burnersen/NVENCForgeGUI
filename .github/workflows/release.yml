# Turns a pushed version tag into a finished release, built on GitHub and
# nowhere else: tests, builds NVENCForgeGUI.exe with "wails build" and
# publishes it as the release asset. The asset name stays NVENCForgeGUI.exe,
# because the window's own update button looks for exactly that file.
#
# Two ways in:
#   - push a tag vX.Y.Z (equal to guiVersion in main.go), or
#   - Actions > Release > Run workflow with an existing tag.
# The release text is .github/release-notes/vX.Y.Z.md if that file exists,
# otherwise the message of the annotated tag (git tag -a).
#
# Dry run: tick "dry run" when starting it by hand. The exe is built and
# checked and stays on the run page as a workflow artifact; nothing is
# signed or published. Pull requests that change this workflow, wails.json,
# build/windows/ or .signpath/ get a dry run by themselves.
#
# Code signing (SignPath Foundation) is prepared but off until the
# repository has the variable SIGNPATH_ORGANIZATION_ID and the secret
# SIGNPATH_API_TOKEN; see .signpath/README.md. Without them the exe is
# released unsigned.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, e.g. v2.2.0: an existing tag is built as it is, a new one is built from main and tagged'
        required: true
      dry_run:
        description: 'Dry run: build and check only, sign and publish nothing'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.signpath/**'
      - 'wails.json'
      - 'build/windows/**'

# Publishing needs write access to the repository contents; actions: read
# lets SignPath fetch the unsigned exe from this run.
permissions:
  contents: write
  actions: read

env:
  DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}

jobs:
  release:
    runs-on: windows-latest
    # Includes up to one hour of waiting for the signing approval.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # The annotated tag message can be the release text, and it only
          # exists in a clone that carries the tag objects.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Started by hand: an existing tag is built exactly as tagged. A new
      # version is built from main, and publishing the release creates its
      # tag on the commit that was built.
      - name: Commit to build
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            git checkout -q --detach "refs/tags/$env:RELEASE_TAG"
            Write-Host "Building the existing tag $env:RELEASE_TAG."
          } elseif ($env:GITHUB_REF_NAME -ne 'main' -and $env:DRY_RUN -ne 'true') {
            Write-Host "::error::A new version is released from main only, not from $env:GITHUB_REF_NAME."
            exit 1
          } else {
            Write-Host "Tag $env:RELEASE_TAG does not exist yet: building $env:GITHUB_REF_NAME, the release creates the tag."
          }
          $global:LASTEXITCODE = 0

      # Node only runs the window checks; the interface itself has no build step.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A tag that disagrees with guiVersion would publish an exe that keeps
      # offering itself as an update. A pull request has no tag: it builds
      # the version in main.go.
      - name: Tag matches guiVersion
        run: |
          $match = Select-String -Path main.go -Pattern '^const guiVersion = "(.+)"' | Select-Object -First 1
          if (-not $match) {
            Write-Host "::error::Could not find guiVersion in main.go"
            exit 1
          }
          $inCode = $match.Matches[0].Groups[1].Value
          $tag = "${{ inputs.tag || github.ref_name }}"
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $tag = "v$inCode" }
          if ("v$inCode" -ne $tag) {
            Write-Host "::error::Tag $tag does not match guiVersion $inCode in main.go"
            exit 1
          }
          Write-Host "Tag $tag matches guiVersion $inCode."
          "TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$inCode" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: go test
        run: go test ./...

      - name: window checks
        run: |
          $checks = Get-ChildItem -Path frontend\*_check.js | Sort-Object Name
          if (-not $checks) {
            Write-Host "::error::No frontend\*_check.js found - nothing was checked."
            exit 1
          }
          $failed = @()
          foreach ($check in $checks) {
            node $check.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $check.Name }
          }
          if ($failed) {
            Write-Host "::error::These window checks failed: $($failed -join ', ')"
            exit 1
          }

      # wails.json feeds the file properties (right-click > Properties >
      # Details); SignPath only signs an exe whose properties name
      # NVENCForgeGUI and the version of the release.
      - name: Version into wails.json
        run: |
          $text = [IO.File]::ReadAllText("$PWD\wails.json")
          $text = [regex]::Replace($text, '"productVersion": "[^"]*"', "`"productVersion`": `"$env:VERSION`"")
          [IO.File]::WriteAllText("$PWD\wails.json", $text, [Text.UTF8Encoding]::new($false))

      # The Wails CLI of the same version as in go.mod; "go run" needs no
      # global install.
      - name: Build
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.14.0 build -trimpath
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build/bin/NVENCForgeGUI.exe NVENCForgeGUI.exe

      - name: Check the file properties
        run: ./.signpath/check-files.ps1 -ProductName NVENCForgeGUI -ProductVersion $env:VERSION -Path NVENCForgeGUI.exe

      # --- code signing ------------------------------------------------------
      - name: 'code signing: on or off?'
        id: signing
        env:
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          $hasOrganization = -not [string]::IsNullOrWhiteSpace($env:ORGANIZATION_ID)
          $hasToken = $env:HAS_TOKEN -eq 'true'
          if ($env:DRY_RUN -eq 'true') {
            $on = $false
            Write-Host 'Dry run: nothing is signed.'
          } elseif ($hasOrganization -ne $hasToken) {
            Write-Host '::error::Code signing is half set up: SIGNPATH_ORGANIZATION_ID and SIGNPATH_API_TOKEN must both be set, or neither (see .signpath/README.md).'
            exit 1
          } else {
            $on = $hasOrganization -and $hasToken
            Write-Host ($(if ($on) { 'Code signing is on.' } else { 'Code signing is off: this release is unsigned.' }))
          }
          "enabled=$($on.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 'code signing: collect the exe'
        if: steps.signing.outputs.enabled == 'true'
        run: |
          New-Item -ItemType Directory sign/unsigned -Force | Out-Null
          Copy-Item NVENCForgeGUI.exe sign/unsigned/

      - name: 'code signing: upload the exe'
        id: unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: sign/unsigned
          if-no-files-found: error

      - name: 'code signing: sign (approve the request in SignPath)'
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'NVENCForgeGUI' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: sign/signed
          parameters: |
            version: "${{ env.VERSION }}"

      - name: 'code signing: take over the signed exe'
        if: steps.signing.outputs.enabled == 'true'
        run: |
          Copy-Item sign/signed/NVENCForgeGUI.exe NVENCForgeGUI.exe -Force
          ./.signpath/check-files.ps1 -ProductName NVENCForgeGUI -ProductVersion $env:VERSION -Path NVENCForgeGUI.exe -Signed

      - name: 'dry run: keep the exe on the run page'
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: NVENCForgeGUI.exe
          retention-days: 7

      # gh is preinstalled on GitHub runners and signs in with the token this
      # workflow already holds, so no personal access token is involved.
      - name: Publish release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          $tag = $env:TAG
          $title = "NVENCForgeGUI $tag"
          $file = ".github/release-notes/$tag.md"
          if (Test-Path $file) {
            $notes = [IO.File]::ReadAllText("$PWD/$file")
          } else {
            $notes = (git tag -l --format='%(contents)' $tag) -join "`n"
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Host "::error::No release text: add $file or create the tag with 'git tag -a'."
            exit 1
          }
          # The release page is the download page, so it links the code
          # signing policy and says whether this exe is signed.
          $policy = "https://github.com/$env:GITHUB_REPOSITORY/blob/main/CODE_SIGNING.md"
          if ($env:SIGNED -eq 'true') {
            $footer = "NVENCForgeGUI.exe is signed. Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). [Code signing policy]($policy)"
          } else {
            $footer = "NVENCForgeGUI.exe is not code signed, so Windows SmartScreen may warn. [Code signing policy]($policy)"
          }
          # A friendly line for the people who read release texts: the ones
          # updating, who are happy enough to stay.
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          if ($env:SIGNED -eq 'true') {
              $footer += "`n`n💜 Happy with NVENCForgeGUI? A ⭐ on [GitHub]($repo) is the easiest way to let me know, and it helps others find it. Or [tell me what you use it for]($repo/issues/new)."
          } else {
              $footer += "`n`n💜 Happy with NVENCForgeGUI? A ⭐ on [GitHub]($repo) is the easiest way to let me know, and it helps NVENCForgeGUI qualify for free code signing, so the Windows warning goes away for everyone. Or [tell me what you use it for]($repo/issues/new)."
          }
          [IO.File]::WriteAllText("$PWD/release-notes.md", $notes.TrimEnd() + "`n`n---`n`n$footer`n", [Text.UTF8Encoding]::new($false))

          Write-Host "Publishing $tag with NVENCForgeGUI.exe ($((Get-Item NVENCForgeGUI.exe).Length) bytes)."
          # A rerun (a corrected workflow, a retried build) refreshes the
          # release that is there instead of failing on the second attempt.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists - refreshing its notes and asset."
            gh release edit $tag --title $title --notes-file release-notes.md --draft=false
            gh release upload $tag NVENCForgeGUI.exe --clobber
          } else {
            gh release create $tag NVENCForgeGUI.exe --target (git rev-parse HEAD) --title $title --notes-file release-notes.md
          }
